<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Scrolling</title>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.14/dist/lenis.css" />
    <style>
      @font-face {
        font-family: PP Neue Corp Wide;
        src: url('https://cdn.prod.website-files.com/671752cd4027f01b1b8f1c7f/6717e399d30a606fed425914_PPNeueCorp-WideUltrabold.woff2')
          format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: PP Neue Montreal;
        src: url('https://cdn.prod.website-files.com/6819ed8312518f61b84824df/6819ed8312518f61b84825ba_PPNeueMontreal-Medium.woff2')
          format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        background-color: #000;
        margin: 0;
        padding: 0;
      }

      body {
        color: #efeeec;
        cursor: url('https://cdn.prod.website-files.com/6708f85ff3d3cba6aff436fb/671251b239d7aeb290a31ac5_cursor-default%402x.svg')
            2 0,
          auto;
        font-size: 1vw;
      }

      a,
      button {
        cursor: url('https://cdn.prod.website-files.com/6708f85ff3d3cba6aff436fb/671251b212e6b71494aa67ff_cursor-pointer%402x.svg')
            12 0,
          pointer;
      }

      .osmo-icon-svg {
        width: 8em;
        position: relative;
      }

      .parallax__header {
        z-index: 2;
        justify-content: center;
        align-items: center;
        min-height: 100svh;
        padding: 100px 50px;
        display: flex;
        position: relative;
      }

      .parallax {
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      .parallax__content {
        justify-content: center;
        align-items: center;
        min-height: 100svh;
        padding: 100px 50px;
        display: flex;
        position: relative;
        background-color: #000;
      }

      .parallax__visuals {
        object-fit: cover;
        width: 100%;
        max-width: none;
        height: 120%;
        position: absolute;
        top: 0;
        left: 0;
      }

      .parallax__layers {
        object-fit: cover;
        width: 100%;
        max-width: none;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
      }

      .parallax__fade {
        z-index: 30;
        width: 100%;
        max-width: none;
        height: 20%;
        position: absolute;
        bottom: 0;
        left: 0;
        background: linear-gradient(
          #0000,
          #00000001 1.8%,
          #00000002 4.8%,
          #00000005 9%,
          #0000000b 13.9%,
          #00000013 19.8%,
          #00000020 27%,
          #00000031 35%,
          #00000047 43.5%,
          #00000061 53%,
          #0000008a 66%,
          #000000bc 81%,
          #000
        );
      }

      .parallax__black-line-overflow {
        z-index: 20;
        background-color: #000;
        width: 100%;
        height: 2px;
        position: absolute;
        bottom: -1px;
        left: 0;
      }

      .parallax__title {
        pointer-events: auto;
        text-align: center;
        text-transform: none;
        margin-top: 0;
        margin-bottom: 0.1em;
        margin-right: 0.075em;
        font-family: PP Neue Corp Wide, sans-serif;
        font-size: 11vw;
        font-weight: 800;
        line-height: 1;
        position: relative;
        color: #efeeec;
      }

      .parallax__layer-title {
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100svh;
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
      }

      .parallax__layer-img {
        pointer-events: none;
        object-fit: cover;
        width: 100%;
        max-width: none;
        height: 117.5%;
        position: absolute;
        top: -17.5%;
        left: 0;
      }

      .osmo-credits {
        z-index: 999;
        pointer-events: none;
        flex-flow: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 4em;
        padding: 1em;
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
      }

      .osmo-credits__p {
        pointer-events: auto;
        color: #efeeec80;
        text-align: center;
        margin: 0;
        font-family: PP Neue Montreal, sans-serif;
        font-size: 1.125em;
        font-weight: 500;
        line-height: 1.3;
      }

      .osmo-credits__p-a {
        color: #efeeec;
      }
    </style>
  </head>
  <body>
    <div class="parallax">
      <section class="parallax__header">
        <div class="parallax__visuals">
          <div class="parallax__black-line-overflow"></div>
          <div data-parallax-layers class="parallax__layers">
            <img
              src="https://cdn.21st.dev/assets/mirror/a4/a43f4eae3459c461345ee676f12d6e1ddca65e8a5279a5af00d475b17ff83aea.webp"
              loading="eager"
              width="800"
              data-parallax-layer="1"
              alt=""
              class="parallax__layer-img"
            />
            <img
              src="https://cdn.21st.dev/assets/mirror/50/50ca6a0d36d2780bfcb469d6db7eaec0be7e0d2961ba69a63d2a1473b040338d.webp"
              loading="eager"
              width="800"
              data-parallax-layer="2"
              alt=""
              class="parallax__layer-img"
            />
            <div data-parallax-layer="3" class="parallax__layer-title">
              <h2 class="parallax__title">Parallax</h2>
            </div>
            <img
              src="https://cdn.21st.dev/assets/mirror/e1/e1c8137b5f971c3b3ec1a0f9e79b9c17018767005f844a10082b890472afecfb.webp"
              loading="eager"
              width="800"
              data-parallax-layer="4"
              alt=""
              class="parallax__layer-img"
            />
          </div>
          <div class="parallax__fade"></div>
        </div>
      </section>
      <section class="parallax__content">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100%"
          viewBox="0 0 160 160"
          fill="none"
          class="osmo-icon-svg"
        >
          <path
            d="M94.8284 53.8578C92.3086 56.3776 88 54.593 88 51.0294V0H72V59.9999C72 66.6273 66.6274 71.9999 60 71.9999H0V87.9999H51.0294C54.5931 87.9999 56.3777 92.3085 53.8579 94.8283L18.3431 130.343L29.6569 141.657L65.1717 106.142C67.684 103.63 71.9745 105.396 72 108.939V160L88.0001 160L88 99.9999C88 93.3725 93.3726 87.9999 100 87.9999H160V71.9999H108.939C105.407 71.9745 103.64 67.7091 106.12 65.1938L106.142 65.1716L141.657 29.6568L130.343 18.3432L94.8284 53.8578Z"
            fill="currentColor"
          ></path>
        </svg>
      </section>
    </div>
    <div class="osmo-credits">
      <p class="osmo-credits__p">
        Resource by
        <a target="_blank" href="https://www.osmo.supply/" class="osmo-credits__p-a">Osmo</a>
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.gsap || !window.ScrollTrigger || !window.Lenis) return;

        gsap.registerPlugin(ScrollTrigger);

        document.querySelectorAll('[data-parallax-layers]').forEach((triggerElement) => {
          const tl = gsap.timeline({
            scrollTrigger: {
              trigger: triggerElement,
              start: '0% 0%',
              end: '100% 0%',
              scrub: 0,
            },
          });

          const layers = [
            { layer: '1', yPercent: 70 },
            { layer: '2', yPercent: 55 },
            { layer: '3', yPercent: 40 },
            { layer: '4', yPercent: 10 },
          ];

          layers.forEach((layerObj, idx) => {
            tl.to(
              triggerElement.querySelectorAll(`[data-parallax-layer="${layerObj.layer}"]`),
              { yPercent: layerObj.yPercent, ease: 'none' },
              idx === 0 ? undefined : '<',
            );
          });
        });

        const lenis = new Lenis();
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => {
          lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);
      });
    </script>
  </body>
</html>
